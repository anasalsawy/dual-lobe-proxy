<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual-Lobe Multi-Agent Room</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: #161b22;
    padding: 12px 24px;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #58a6ff; }
  header .status { font-size: 12px; color: #7d8590; }
  header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .dot.green { background: #3fb950; }
  .config-bar {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 8px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 12px;
  }
  .config-bar input {
    font-family: inherit;
    font-size: 12px;
    border: 1px solid #30363d;
    background: #0d1117;
    color: #e6edf3;
    padding: 6px 10px;
    border-radius: 4px;
  }
  .config-bar input { width: 220px; }
  .config-bar label { color: #7d8590; }
  .config-bar .hint { margin-left: auto; color: #7d8590; }

  .room {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg .sender {
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .msg.user {
    align-self: center;
    background: #1f6feb22;
    border: 1px solid #1f6feb44;
    text-align: center;
    max-width: 90%;
  }
  .msg.user .sender { color: #58a6ff; }

  .msg.atlas { align-self: flex-start; background: #1f6feb11; border-left: 3px solid #1f6feb; }
  .msg.atlas .sender { color: #58a6ff; }

  .msg.nova { align-self: flex-start; background: #23863611; border-left: 3px solid #238636; }
  .msg.nova .sender { color: #3fb950; }

  .msg.sage { align-self: flex-start; background: #8957e511; border-left: 3px solid #8957e5; }
  .msg.sage .sender { color: #bc8cff; }

  .msg.suppressed {
    align-self: center;
    background: transparent;
    border: 1px dashed #f8514944;
    color: #f8514988;
    font-style: italic;
    font-size: 12px;
    padding: 6px 14px;
    max-width: 60%;
    text-align: center;
  }
  .msg.suppressed .sender { color: #f8514988; }

  .meter {
    margin-top: 6px;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    border-left: 3px solid;
  }
  .meter.green { border-color: #3fb950; color: #3fb950; background: #3fb95011; }
  .meter.yellow { border-color: #d29922; color: #d29922; background: #d2992211; }
  .meter.red { border-color: #f85149; color: #f85149; background: #f8514911; }

  .agents-bar {
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 8px 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: #7d8590;
  }
  .agents-bar .agent-tag {
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 11px;
  }
  .agent-tag.atlas { background: #1f6feb22; color: #58a6ff; }
  .agent-tag.nova { background: #23863622; color: #3fb950; }
  .agent-tag.sage { background: #8957e522; color: #bc8cff; }
  .agent-tag .badge { font-size: 9px; opacity: 0.7; margin-left: 4px; }

  .controls {
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 12px 24px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .controls input {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    border: 1px solid #30363d;
    background: #0d1117;
    color: #e6edf3;
    padding: 10px 14px;
    border-radius: 8px;
    outline: none;
  }
  .controls input:focus { border-color: #1f6feb; }
  .controls button {
    background: #238636;
    border: 1px solid #238636;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 24px;
    border-radius: 8px;
    cursor: pointer;
  }
  .controls button:hover { background: #2ea043; }
  .controls button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
  .clear-btn {
    font-size: 11px;
    padding: 4px 12px;
    background: transparent;
    border: 1px solid #30363d;
    color: #7d8590;
    cursor: pointer;
    border-radius: 4px;
  }
  .clear-btn:hover { border-color: #f85149; color: #f85149; }

  .spinner-inline {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #30363d;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-left: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .typing { font-size: 12px; color: #7d8590; padding: 4px 0; }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
    <h1>Dual-Lobe Multi-Agent Room</h1>
    <button class="clear-btn" onclick="clearRoom()">Clear</button>
  </div>
  <div class="status">
    <span class="dot green"></span>
    <span id="apiStatus">Ready</span>
  </div>
</header>

<div class="config-bar">
  <label>API URL:</label>
  <input id="apiUrl" value="https://dual-lobe-proxy-production-e78e.up.railway.app" oninput="saveConfig()">
  <label>API Key:</label>
  <input id="apiKey" type="password" placeholder="Enter API key..." oninput="saveConfig()">
  <span class="hint">Address agents by name (Atlas, Nova, Sage) or broadcast "everyone"</span>
</div>

<div class="room" id="room"></div>

<div class="agents-bar">
  <span>In room:</span>
  <span class="agent-tag atlas">Atlas<span class="badge">T1 Chief</span></span>
  <span class="agent-tag nova">Nova<span class="badge">T2 Moderator</span></span>
  <span class="agent-tag sage">Sage<span class="badge">T3 Worker</span></span>
  <span style="margin-left:auto;color:#484f58">All agents hear every message. Routing decides who responds.</span>
</div>

<div class="controls">
  <input id="msgInput" placeholder="Type a message to the room..." onkeydown="if(event.key==='Enter')sendMsg()">
  <button id="sendBtn" onclick="sendMsg()">Send</button>
</div>

<script>
const AGENTS = {
  atlas: { model: 'sawii/dl-dialogue1', name: 'Atlas', cls: 'atlas',
    sys: 'You are Atlas, the chief coordinator of a multi-agent team. You delegate tasks to Nova (moderator) and Sage (worker) by addressing them by name. You do NOT write code yourself — you break tasks into pieces, assign them, and verify results. Report final status to the user.' },
  nova:  { model: 'sawii/dl-dialogue2', name: 'Nova', cls: 'nova',
    sys: 'You are Nova, the moderator of a multi-agent team. You receive tasks from Atlas (chief) and break them into subtasks for Sage (worker). You define specs and review implementations. Report results back to Atlas by name.' },
  sage:  { model: 'sawii/dl-dialogue3', name: 'Sage', cls: 'sage',
    sys: 'You are Sage, the worker of a multi-agent team. You execute tasks assigned by Atlas (chief) or Nova (moderator). You do NOT delegate. You report results back by addressing the assigner by name. Be precise and provide evidence.' },
};

// Shared conversation history — all agents see the same messages
let sharedHistory = [];

function getConfig() {
  return {
    url: document.getElementById('apiUrl').value.replace(/\/$/, ''),
    key: document.getElementById('apiKey').value,
  };
}

function saveConfig() {
  localStorage.setItem('dl_room', JSON.stringify({
    url: document.getElementById('apiUrl').value,
    key: document.getElementById('apiKey').value,
  }));
}

function loadConfig() {
  const saved = localStorage.getItem('dl_room');
  if (saved) {
    const cfg = JSON.parse(saved);
    document.getElementById('apiUrl').value = cfg.url || '';
    document.getElementById('apiKey').value = cfg.key || '';
  }
}

function addMsg(cls, sender, text, meter) {
  const room = document.getElementById('room');
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = `<div class="sender">${sender}</div>${escapeHtml(text)}`;
  room.appendChild(div);

  if (meter) {
    const m = document.createElement('div');
    m.className = 'meter ' + (meter.level || 'green');
    m.textContent = meter.text;
    room.appendChild(m);
  }

  room.scrollTop = room.scrollHeight;
}

function addSuppressed(agentName) {
  const room = document.getElementById('room');
  const div = document.createElement('div');
  div.className = 'msg suppressed';
  div.innerHTML = `<div class="sender">${agentName}</div>[suppressed by routing — not addressed to this agent]`;
  room.appendChild(div);
  room.scrollTop = room.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showTyping(agentName) {
  const room = document.getElementById('room');
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing-' + agentName;
  div.innerHTML = `${agentName} is thinking<span class="spinner-inline"></span>`;
  room.appendChild(div);
  room.scrollTop = room.scrollHeight;
}

function removeTyping(agentName) {
  const el = document.getElementById('typing-' + agentName);
  if (el) el.remove();
}

async function callAgent(agentKey, messages) {
  const cfg = getConfig();
  const agent = AGENTS[agentKey];
  const body = {
    model: agent.model,
    messages: [{ role: 'system', content: agent.sys }, ...messages],
    max_tokens: 400,
    stream: false,
  };
  const res = await fetch(cfg.url + '/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function parseMeter(content) {
  if (!content) return null;
  const match = content.match(/Deception Meter:\s*(GREEN|YELLOW|RED)/i);
  if (!match) return null;
  const level = match[1].toUpperCase().toLowerCase();
  const lines = content.split('\n');
  let rationale = '';
  for (const line of lines) {
    if (line.includes('Deception Meter')) continue;
    if (line.startsWith('>')) {
      rationale = line.replace(/^>\s*/, '').trim();
      break;
    }
  }
  let text = 'Deception Meter: ' + match[1];
  if (rationale) text += ' — ' + rationale;
  return { level, text };
}

function cleanContent(content) {
  if (!content) return '';
  return content.replace(/\n*\n> ⚠️.*$/s, '').replace(/\n*\n> 📋.*$/s, '').trim();
}

async function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  const cfg = getConfig();
  if (!cfg.key) { alert('Enter API key first'); return; }

  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('apiStatus').textContent = 'Processing...';

  // Add user message to room and shared history
  addMsg('user', 'You', text);
  const userMsg = { role: 'user', content: text };
  sharedHistory.push(userMsg);

  // Send to all three agents simultaneously — they all hear the message
  const agentKeys = ['atlas', 'nova', 'sage'];
  agentKeys.forEach(k => showTyping(AGENTS[k].name));

  await Promise.all(agentKeys.map(async (k) => {
    try {
      const data = await callAgent(k, [...sharedHistory]);
      removeTyping(AGENTS[k].name);
      const content = data.choices?.[0]?.message?.content || '';
      const meter = parseMeter(content);
      const cleaned = cleanContent(content);

      if (!cleaned) {
        addSuppressed(AGENTS[k].name);
      } else {
        addMsg(AGENTS[k].cls, AGENTS[k].name, cleaned, meter);
        sharedHistory.push({ role: 'assistant', content: cleaned, name: AGENTS[k].name });

        // Check if this agent addressed another agent by name — if so, forward to them
        await forwardAgentMessage(k, cleaned);
      }
    } catch (e) {
      removeTyping(AGENTS[k].name);
      addMsg(AGENTS[k].cls, AGENTS[k].name, 'Error: ' + e.message);
      console.error('Agent', k, 'error:', e);
    }
  }));

  document.getElementById('sendBtn').disabled = false;
  document.getElementById('apiStatus').textContent = 'Ready';
}

async function forwardAgentMessage(fromKey, content, depth = 0) {
  if (depth >= 5) return; // Prevent infinite loops

  // Forward to all agents — routing LLM decides who responds
  const agentKeys = Object.keys(AGENTS).filter(k => k !== fromKey);
  const forwardMsg = { role: 'user', content: `${AGENTS[fromKey].name}: ${content}` };

  agentKeys.forEach(k => showTyping(AGENTS[k].name));

  await Promise.all(agentKeys.map(async (k) => {
    try {
      const data = await callAgent(k, [...sharedHistory, forwardMsg]);
      removeTyping(AGENTS[k].name);
      const respContent = data.choices?.[0]?.message?.content || '';
      const meter = parseMeter(respContent);
      const cleaned = cleanContent(respContent);

      if (!cleaned) {
        addSuppressed(AGENTS[k].name);
      } else {
        addMsg(AGENTS[k].cls, AGENTS[k].name, cleaned, meter);
        sharedHistory.push(forwardMsg);
        sharedHistory.push({ role: 'assistant', content: cleaned, name: AGENTS[k].name });
        await forwardAgentMessage(k, cleaned, depth + 1);
      }
    } catch (e) {
      removeTyping(AGENTS[k].name);
      addMsg(AGENTS[k].cls, AGENTS[k].name, 'Error: ' + e.message);
    }
  }));
}

function clearRoom() {
  sharedHistory = [];
  document.getElementById('room').innerHTML = '';
}

loadConfig();
</script>
</body>
</html>
