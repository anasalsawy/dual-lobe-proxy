[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dual-lobe-crewai"
version = "0.1.0"
description = "Three CrewAI implementations of the Dual-Lobe architecture: gated, non-split, and split."
requires-python = ">=3.10"
dependencies = [
  "crewai>=0.80.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
dual-lobe = "dual_lobe_crewai.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dual_lobe_crewai"]
