# Local development only. Postgres roles use development passwords.
x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dual_lobe}:${POSTGRES_PASSWORD:-dual_lobe_dev}@db:5432/${POSTGRES_DB:-dual_lobe}
    RLS_DATABASE_URL: postgresql+asyncpg://dual_lobe_rls:dual_lobe_rls@db:5432/${POSTGRES_DB:-dual_lobe}
    DUAL_LOBE_INITIALIZE: "false"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dual_lobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dual_lobe_dev}
      POSTGRES_DB: ${POSTGRES_DB:-dual_lobe}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  initialize:
    <<: *app
    command: ["true"]
    environment:
      <<: *app-env
      DUAL_LOBE_INITIALIZE: "true"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    <<: *app
    command: ["uvicorn", "dual_lobe.api.app:app", "--host", "0.0.0.0", "--port", "8801"]
    ports:
      - "127.0.0.1:${DUAL_LOBE_PORT:-8801}:8801"
    depends_on:
      initialize:
        condition: service_completed_successfully

  b-worker:
    <<: *app
    command: ["python", "-m", "dual_lobe.b.worker"]
    depends_on:
      initialize:
        condition: service_completed_successfully

  # Persona runtime: the persona's body. One container IS the sandbox —
  # its terminal, files, and workspace all live server-side inside this
  # container, never on user machines. Its mind is the proxy: every agent
  # LLM call goes through gateway:8801, so A speaks, B verifies, C observes.
  persona:
    build:
      context: .
      dockerfile: persona/Dockerfile
    environment:
      DUAL_LOBE_PROXY_URL: http://gateway:8801/v1
      DUAL_LOBE_PERSONA_MODEL: openai/sawii/dl-bidirectional
      DUAL_LOBE_PERSONA_PORT: "8802"
    ports:
      - "127.0.0.1:${DUAL_LOBE_PERSONA_PORT:-8802}:8802"
    volumes:
      - persona_workspaces:/var/lib/dual-lobe-persona
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8802/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pg_data:
  persona_workspaces:
